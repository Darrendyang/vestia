spring:
  application:
    name: aishop-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/aishop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage-root: ${STORAGE_ROOT:./data/uploads}
  demo-mode: ${DEMO_MODE:true}
  demo-user-id: ${DEMO_USER_ID:00000000-0000-0000-0000-000000000001}
