name: aishop_mobile
description: AI personal wardrobe and outfit assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.5.0
  http_parser: ^4.1.2
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  webview_flutter: ^4.13.0
  web: ^1.1.2
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/clothes/
    - assets/avatar/
    - assets/viewer/
    - assets/viewer/addons/loaders/
    - assets/viewer/addons/controls/
    - assets/viewer/addons/utils/
